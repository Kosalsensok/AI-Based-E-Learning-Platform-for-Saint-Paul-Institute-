<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="inactiveBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="inactiveBadgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Glow Circle -->
  <circle cx="16" cy="16" r="14" fill="url(#inactiveBadgeGrad)" filter="url(#inactiveBadgeGlow)" />
  <!-- Inner White Minus / Pause Bar -->
  <rect x="9" y="14" width="14" height="4" rx="2" fill="#FFFFFF" />
</svg>
