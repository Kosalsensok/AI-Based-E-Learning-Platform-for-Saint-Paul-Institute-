<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="onlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="onlineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Badge Circle -->
  <circle cx="32" cy="32" r="28" fill="url(#onlineGrad)" filter="url(#onlineGlow)" />
  
  <!-- Outer Signal Wave 2 -->
  <path d="M 16 26 A 20 20 0 0 1 48 26" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  
  <!-- Middle Signal Wave 1 -->
  <path d="M 22 33 A 13 13 0 0 1 42 33" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  
  <!-- Inner Active Signal Dot -->
  <circle cx="32" cy="42" r="5" fill="#FFFFFF" />
  
  <!-- Glowing Center Pulse Point -->
  <circle cx="32" cy="42" r="2.5" fill="#10B981" />
</svg>
