<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="perfGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="perfGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="perfGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="perfShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-opacity="0.16" flood-color="#4F46E5"/>
    </filter>
  </defs>

  <g filter="url(#perfShadow)">
    <!-- Base Plate -->
    <rect x="6" y="10" width="52" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- 3 Gradient Bars -->
    <rect x="14" y="30" width="8" height="18" rx="3" fill="url(#perfGrad1)" />
    <rect x="28" y="22" width="8" height="26" rx="3" fill="url(#perfGrad2)" />
    <rect x="42" y="16" width="8" height="32" rx="3" fill="url(#perfGrad3)" />

    <!-- Sparkle on highest bar -->
    <circle cx="46" cy="16" r="2.5" fill="#FDE047" />
  </g>
</svg>
