<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="chatGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="chatGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="flaticonChatShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.16" flood-color="#7E22CE"/>
    </filter>
  </defs>

  <!-- Back Chat Bubble (Purple) -->
  <g filter="url(#flaticonChatShadow)">
    <path d="M12 14 C12 8.5 16.5 4 22 4 H46 C51.5 4 56 8.5 56 14 V26 C56 31.5 51.5 36 46 36 H38 L26 44 V36 H22 C16.5 36 12 31.5 12 26 V14 Z" fill="url(#chatGrad1)" />
    <!-- 3 Dots inside main bubble -->
    <circle cx="26" cy="20" r="3" fill="#FFFFFF" opacity="0.9" />
    <circle cx="34" cy="20" r="3" fill="#FFFFFF" opacity="0.9" />
    <circle cx="42" cy="20" r="3" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Front Small Chat Bubble (Cyan/Indigo) -->
  <g filter="url(#flaticonChatShadow)">
    <path d="M8 32 C8 27.5 11.5 24 16 24 H34 C38.5 24 42 27.5 42 32 V40 C42 44.5 38.5 48 34 48 H26 L16 54 V48 H16 C11.5 48 8 44.5 8 40 V32 Z" fill="#38BDF8" />
    <!-- Question mark or smile -->
    <circle cx="20" cy="36" r="2" fill="#FFFFFF" />
    <circle cx="26" cy="36" r="2" fill="#FFFFFF" />
    <circle cx="32" cy="36" r="2" fill="#FFFFFF" />
  </g>
</svg>
