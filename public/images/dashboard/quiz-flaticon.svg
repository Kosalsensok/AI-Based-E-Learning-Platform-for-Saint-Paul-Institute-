<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="quizSheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="quizBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="flaticonQuizShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.16" flood-color="#D97706"/>
    </filter>
  </defs>

  <g filter="url(#flaticonQuizShadow)">
    <!-- Main Test Paper Sheet -->
    <rect x="10" y="8" width="44" height="48" rx="6" fill="url(#quizSheet)" stroke="#FDE68A" stroke-width="1.5" />
    
    <!-- Top Header Banner on Paper -->
    <path d="M10 14 C10 10.5 13.5 8 17 8 H47 C50.5 8 54 10.5 54 14 V18 H10 V14 Z" fill="url(#quizBadge)" />
    
    <!-- Test Lines -->
    <!-- Row 1: Checkbox & Line -->
    <rect x="16" y="24" width="7" height="7" rx="1.5" fill="#10B981" />
    <path d="M18 27.5 L19.5 29 L21.5 26" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    <line x1="27" y1="27.5" x2="48" y2="27.5" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Row 2: Checkbox & Line -->
    <rect x="16" y="34" width="7" height="7" rx="1.5" fill="#10B981" />
    <path d="M18 37.5 L19.5 39 L21.5 36" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    <line x1="27" y1="37.5" x2="45" y2="37.5" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Row 3: Checkbox & Line -->
    <rect x="16" y="44" width="7" height="7" rx="1.5" fill="#F59E0B" />
    <path d="M18 47.5 L19.5 49 L21.5 46" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    <line x1="27" y1="47.5" x2="40" y2="47.5" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />

    <!-- A+ Golden Stamp Badge on Bottom Right -->
    <circle cx="46" cy="46" r="9" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="46" y="50" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">A+</text>
  </g>
</svg>
