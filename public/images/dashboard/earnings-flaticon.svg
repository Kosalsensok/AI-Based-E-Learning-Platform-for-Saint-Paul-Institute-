<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="walletGrad" x1="8" y1="14" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="walletFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="flaticonEarnShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity="0.18" flood-color="#047857"/>
    </filter>
  </defs>

  <!-- Green Cash Bills sticking out of Wallet -->
  <g filter="url(#flaticonEarnShadow)">
    <!-- Back Bill -->
    <rect x="18" y="10" width="30" height="14" rx="2" fill="url(#billGrad)" stroke="#059669" stroke-width="1" transform="rotate(-6 33 17)" />
    <!-- Front Bill -->
    <rect x="20" y="12" width="30" height="14" rx="2" fill="#D1FAE5" stroke="#10B981" stroke-width="1" transform="rotate(4 35 19)" />
    <circle cx="35" cy="19" r="3" fill="#34D399" opacity="0.6" />
  </g>

  <!-- Main Leather Wallet Body with 3D Shadow -->
  <g filter="url(#flaticonEarnShadow)">
    <rect x="8" y="20" width="48" height="34" rx="6" fill="url(#walletGrad)" />
    <!-- Wallet Stitching Accent -->
    <rect x="11" y="23" width="42" height="28" rx="4" fill="none" stroke="#A7F3D0" stroke-width="1" stroke-dasharray="3 2" opacity="0.4" />
    
    <!-- Wallet Flap & Golden Clasp -->
    <path d="M38 28 H56 V44 H38 C34 44 32 40 32 36 C32 32 34 28 38 28 Z" fill="url(#walletFlap)" stroke="#047857" stroke-width="1" />
    <circle cx="42" cy="36" r="3.5" fill="url(#goldCoin)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="42" cy="36" r="1.5" fill="#B45309" />
  </g>

  <!-- Stood-up Gold Coins in front of Wallet -->
  <g filter="url(#flaticonEarnShadow)">
    <!-- Coin 1 (Left) -->
    <circle cx="16" cy="46" r="7" fill="url(#goldCoin)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="16" cy="46" r="5" fill="none" stroke="#FDE68A" stroke-width="1" />
    <text x="16" y="49" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#78350F" text-anchor="middle">$</text>

    <!-- Coin 2 (Right) -->
    <circle cx="26" cy="48" r="8" fill="url(#goldCoin)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="26" cy="48" r="6" fill="none" stroke="#FDE68A" stroke-width="1" />
    <text x="26" y="51.5" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#78350F" text-anchor="middle">$</text>
  </g>

  <!-- Sparkle Accents -->
  <path d="M52 14 L53 17 L56 18 L53 19 L52 22 L51 19 L48 18 L51 17 Z" fill="#FDE047" />
  <path d="M10 26 L11 28 L13 29 L11 30 L10 32 L9 30 L7 29 L9 28 Z" fill="#34D399" />
</svg>
