<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bookGrad1" x1="12" y1="18" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="bookGrad2" x1="8" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="16" y1="8" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="flaticonShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity="0.15" flood-color="#0284C7"/>
    </filter>
  </defs>

  <!-- Bottom Stack Book -->
  <rect x="10" y="44" width="44" height="10" rx="3" fill="#E2E8F0" />
  <path d="M10 44 H50 C52.2 44 54 45.8 54 48 V51 C54 53.2 52.2 55 50 55 H10 V44 Z" fill="#CBD5E1" />
  <rect x="8" y="42" width="46" height="4" rx="2" fill="#0284C7" />

  <!-- Middle Book -->
  <rect x="12" y="32" width="42" height="10" rx="3" fill="#F8FAFC" />
  <path d="M12 32 H50 C52.2 32 54 33.8 54 36 V39 C54 41.2 52.2 43 50 43 H12 V32 Z" fill="#E2E8F0" />
  <rect x="10" y="30" width="44" height="4" rx="2" fill="url(#bookGrad1)" />

  <!-- Main Top Book (Perspective Open Book) -->
  <g filter="url(#flaticonShadow)">
    <rect x="12" y="20" width="40" height="10" rx="3" fill="url(#bookGrad2)" />
    <!-- Pages edge -->
    <path d="M14 22 H48 C49.5 22 51 23 51 24.5 V27.5 C51 29 49.5 30 48 30 H14 V22 Z" fill="#FFFFFF" opacity="0.95" />
    <line x1="14" y1="26" x2="46" y2="26" stroke="#E0F2FE" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Ribbon Bookmark -->
  <path d="M22 20 V33 L26 30 L30 33 V20 H22 Z" fill="url(#goldGrad)" />

  <!-- Graduation Cap Floating on Top -->
  <g filter="url(#flaticonShadow)">
    <!-- Mortarboard Diamond -->
    <polygon points="32,6 52,14 32,22 12,14" fill="url(#capGrad)" stroke="#4338CA" stroke-width="1" />
    <!-- Cap Skull Base -->
    <path d="M20 17.5 V23 C20 26.5 25.4 28 32 28 C38.6 28 44 26.5 44 23 V17.5" fill="#1E1B4B" />
    <!-- Golden Button & Tassel -->
    <circle cx="32" cy="14" r="2.5" fill="url(#goldGrad)" />
    <path d="M32 14 Q44 16 46 25" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="46" cy="25" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Sparkle Accent -->
  <path d="M54 8 L55.5 12 L59.5 13.5 L55.5 15 L54 19 L52.5 15 L48.5 13.5 L52.5 12 Z" fill="#38BDF8" opacity="0.85" />
</svg>
