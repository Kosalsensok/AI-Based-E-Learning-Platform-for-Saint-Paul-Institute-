    <filter id="flaticonEnrShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.16" flood-color="#0284C7"/>
    </filter>
  </defs>

  <g filter="url(#flaticonEnrShadow)">
    <!-- Student Head -->
    <circle cx="30" cy="20" r="10" fill="#FED7AA" />
    <path d="M20 18 C20 12 24 8 30 8 C36 8 40 12 40 18 C38 15 35 15 32 16 C29 17 26 14 20 18 Z" fill="#1E293B" />
    
