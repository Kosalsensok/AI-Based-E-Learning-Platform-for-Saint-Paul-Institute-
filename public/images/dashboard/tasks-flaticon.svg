<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="boardGrad" x1="12" y1="10" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="flaticonTaskShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity="0.18" flood-color="#D97706"/>
    </filter>
  </defs>

  <!-- Wooden / Amber Clipboard Back -->
  <g filter="url(#flaticonTaskShadow)">
    <rect x="12" y="10" width="40" height="48" rx="6" fill="url(#boardGrad)" />
    <!-- White Checklist Sheet -->
    <rect x="16" y="16" width="32" height="38" rx="3" fill="url(#paperGrad)" />
  </g>

  <!-- Metal Clip at Top -->
  <rect x="24" y="6" width="16" height="8" rx="2" fill="url(#clipGrad)" stroke="#64748B" stroke-width="1" />
  <circle cx="32" cy="10" r="2" fill="#475569" />

  <!-- Checklist Row 1: Green Checkmark -->
  <circle cx="22" cy="24" r="3.5" fill="url(#checkGrad)" />
  <path d="M20.5 24 L21.5 25 L23.5 22.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="28" y1="24" x2="43" y2="24" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Checklist Row 2: Green Checkmark -->
  <circle cx="22" cy="32" r="3.5" fill="url(#checkGrad)" />
  <path d="M20.5 32 L21.5 33 L23.5 30.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="28" y1="32" x2="41" y2="32" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Checklist Row 3: Pending Item Line -->
  <circle cx="22" cy="40" r="3.5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2" />
  <line x1="28" y1="40" x2="38" y2="40" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Floating 3D Clock Badge on Bottom Right -->
  <g filter="url(#flaticonTaskShadow)">
    <circle cx="46" cy="46" r="10" fill="url(#clockGrad)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="46" cy="46" r="7.5" fill="#FFF7ED" />
    <!-- Clock Hands -->
    <circle cx="46" cy="46" r="1.5" fill="#EA580C" />
    <line x1="46" y1="46" x2="46" y2="41.5" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" />
    <line x1="46" y1="46" x2="50" y2="46" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Sparkle Accent -->
  <path d="M12 6 L13 8 L15 9 L13 10 L12 12 L11 10 L9 9 L11 8 Z" fill="#FBBF24" />
</svg>
