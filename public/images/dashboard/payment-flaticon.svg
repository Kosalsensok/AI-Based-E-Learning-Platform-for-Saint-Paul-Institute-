<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="payCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="payChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="flaticonPayShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18" flood-color="#059669"/>
    </filter>
  </defs>

  <g filter="url(#flaticonPayShadow)">
    <!-- Credit Card Body -->
    <rect x="6" y="14" width="52" height="36" rx="7" fill="url(#payCard)" />
    
    <!-- Magnetic Stripe -->
    <rect x="6" y="20" width="52" height="7" fill="#064E3B" opacity="0.7" />
    
    <!-- Golden Chip -->
    <rect x="12" y="32" width="10" height="8" rx="2" fill="url(#payChip)" />
    
    <!-- Card Number Lines -->
    <rect x="26" y="34" width="18" height="2" rx="1" fill="#A7F3D0" />
    <rect x="26" y="38" width="12" height="2" rx="1" fill="#A7F3D0" />

    <!-- Visa/Mastercard Dual Circles on Bottom Right -->
    <circle cx="46" cy="38" r="4.5" fill="#EF4444" opacity="0.9" />
    <circle cx="51" cy="38" r="4.5" fill="#FBBF24" opacity="0.9" />
  </g>
</svg>
